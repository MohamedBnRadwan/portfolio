<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · Mohamed Radwan</title>
  <link href="./include/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./include/sign-in.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
  <main class="form-signin w-100 m-auto">
    <form id="questions-form" class="chat-panel p-4 rounded-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><span style="font-size: 40px;">r</span>Chat</h2>
        <a href="./index.html" class="btn btn-sm btn-outline-light">← Back to Portfolio</a>
      </div>
      <p class="text-secondary small">Ask about skills, experience, contact, projects, or certificates.</p>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="input-answer" placeholder="Ask me anything about Radwan">
        <label for="input-answer" id="message">Ask me anything about Radwan</label>
      </div>
      <button class="btn btn-primary w-100" type="submit">Ask</button>
    </form>
  </main>
  <script src="./include/script.js"></script>
</body>
</html>
